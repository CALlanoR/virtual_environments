apiVersion: v1
kind: Service
metadata:
  name: cdc-sink-57
  namespace: cdc-lab
  labels:
    app: cdc-sink
    stack: mysql57
spec:
  type: ClusterIP
  selector:
    app: cdc-sink
    stack: mysql57
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cdc-sink-57
  namespace: cdc-lab
  labels:
    app: cdc-sink
    stack: mysql57
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cdc-sink
      stack: mysql57
  template:
    metadata:
      labels:
        app: cdc-sink
        stack: mysql57
    spec:
      containers:
        - name: echo
          image: mendhak/http-https-echo:40
          imagePullPolicy: IfNotPresent
          env:
            - name: HTTP_PORT
              value: "8080"
            - name: HTTPS_PORT
              value: "8443"
          ports:
            - name: http
              containerPort: 8080
            - name: https
              containerPort: 8443
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
              cpu: 200m
