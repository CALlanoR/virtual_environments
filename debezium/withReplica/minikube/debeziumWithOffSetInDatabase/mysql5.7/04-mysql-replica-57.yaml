apiVersion: v1
kind: Service
metadata:
  name: mysql-replica-57
  namespace: cdc-lab
  labels:
    app: mysql-replica
    stack: mysql57
spec:
  clusterIP: None
  selector:
    app: mysql-replica
    stack: mysql57
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-replica-nodeport-57
  namespace: cdc-lab
  labels:
    app: mysql-replica
    stack: mysql57
spec:
  type: NodePort
  selector:
    app: mysql-replica
    stack: mysql57
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
      nodePort: 30407
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql-replica-57
  namespace: cdc-lab
  labels:
    app: mysql-replica
    stack: mysql57
spec:
  serviceName: mysql-replica-57
  replicas: 1
  selector:
    matchLabels:
      app: mysql-replica
      stack: mysql57
  template:
    metadata:
      labels:
        app: mysql-replica
        stack: mysql57
    spec:
      initContainers:
        - name: wait-for-primary
          image: mysql:5.7
          imagePullPolicy: IfNotPresent
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials-57
                  key: MYSQL_ROOT_PASSWORD
          command:
            - sh
            - -c
            - |
              set -e
              echo "Esperando a mysql-primary-57..."
              until mysqladmin ping -h mysql-primary-57 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent; do
                echo "  primary aun no responde, retry en 3s..."
                sleep 3
              done
              echo "Esperando a que el usuario repl exista en el primary..."
              until mysql -h mysql-primary-57 -urepl -prepl -e 'SELECT 1' >/dev/null 2>&1; do
                echo "  usuario repl aun no replicable, retry en 3s..."
                sleep 3
              done
              echo "Primary listo."
      containers:
        - name: mysql
          image: mysql:5.7
          imagePullPolicy: IfNotPresent
          args:
            - --default-authentication-plugin=mysql_native_password
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials-57
                  key: MYSQL_ROOT_PASSWORD
          ports:
            - name: mysql
              containerPort: 3306
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: config
              mountPath: /etc/mysql/conf.d
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
            - name: healthcheck
              mountPath: /usr/local/bin/replica-healthcheck.sh
              subPath: healthcheck.sh
          readinessProbe:
            exec:
              command: ["/usr/local/bin/replica-healthcheck.sh"]
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 60
          livenessProbe:
            exec:
              command: ["/usr/local/bin/replica-healthcheck.sh"]
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
      volumes:
        - name: config
          configMap:
            name: mysql-replica-config-57
        - name: initdb
          configMap:
            name: mysql-replica-initdb-57
        - name: healthcheck
          configMap:
            name: mysql-replica-healthcheck-57
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
