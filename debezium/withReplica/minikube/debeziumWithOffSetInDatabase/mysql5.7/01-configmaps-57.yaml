apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-primary-config-57
  namespace: cdc-lab
  labels:
    stack: mysql57
data:
  my.cnf: |
    [mysqld]
    server-id                 = 1
    log_bin                   = mysql-bin
    binlog_format             = ROW
    binlog_row_image          = FULL
    gtid_mode                 = ON
    enforce_gtid_consistency  = ON
    expire_logs_days          = 1
    default_authentication_plugin = mysql_native_password
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-primary-initdb-57
  namespace: cdc-lab
  labels:
    stack: mysql57
data:
  01-users.sql: |
    CREATE USER 'repl'@'%' IDENTIFIED BY 'repl';
    GRANT REPLICATION SLAVE ON *.* TO 'repl'@'%';

    CREATE USER 'debezium'@'%' IDENTIFIED BY 'dbz';
    GRANT REPLICATION SLAVE, REPLICATION CLIENT, SELECT, RELOAD ON *.* TO 'debezium'@'%';

    FLUSH PRIVILEGES;
  02-demo-schema.sql: |
    CREATE DATABASE IF NOT EXISTS inventory;
    USE inventory;

    CREATE TABLE customers (
      id          INT          NOT NULL AUTO_INCREMENT,
      first_name  VARCHAR(100) NOT NULL,
      last_name   VARCHAR(100) NOT NULL,
      email       VARCHAR(150) NOT NULL,
      PRIMARY KEY (id)
    ) ENGINE=InnoDB;

    INSERT INTO customers (first_name, last_name, email) VALUES
      ('Ada',     'Lovelace',  'ada@example.com'),
      ('Alan',    'Turing',    'alan@example.com'),
      ('Grace',   'Hopper',    'grace@example.com');

    CREATE TABLE audit_log (
      id        INT          NOT NULL AUTO_INCREMENT,
      message   VARCHAR(255) NOT NULL,
      created_at DATETIME    NOT NULL DEFAULT CURRENT_TIMESTAMP,
      PRIMARY KEY (id)
    ) ENGINE=InnoDB;

    INSERT INTO audit_log (message) VALUES
      ('seed: stack 5.7 initialized');
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-replica-config-57
  namespace: cdc-lab
  labels:
    stack: mysql57
data:
  my.cnf: |
    [mysqld]
    server-id                 = 2
    log_bin                   = mysql-bin
    binlog_format             = ROW
    binlog_row_image          = FULL
    log_slave_updates         = ON
    gtid_mode                 = ON
    enforce_gtid_consistency  = ON
    read_only                 = ON
    relay_log                 = mysql-relay-bin
    expire_logs_days          = 1
    default_authentication_plugin = mysql_native_password
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-replica-initdb-57
  namespace: cdc-lab
  labels:
    stack: mysql57
data:
  01-start-replica.sql: |
    CHANGE MASTER TO
      MASTER_HOST          = 'mysql-primary-57',
      MASTER_PORT          = 3306,
      MASTER_USER          = 'repl',
      MASTER_PASSWORD      = 'repl',
      MASTER_AUTO_POSITION = 1;

    START SLAVE;
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-replica-healthcheck-57
  namespace: cdc-lab
  labels:
    stack: mysql57
data:
  healthcheck.sh: |
    #!/bin/sh
    set -e
    mysqladmin ping --silent -h localhost -uroot -proot >/dev/null
    status=$(mysql -uroot -proot -e 'SHOW SLAVE STATUS\G' 2>/dev/null)
    echo "$status" | grep -q 'Slave_IO_Running: Yes'
    echo "$status" | grep -q 'Slave_SQL_Running: Yes'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: debezium-config-57
  namespace: cdc-lab
  labels:
    stack: mysql57
data:
  application.properties: |
    debezium.sink.type=http
    debezium.sink.http.url=http://cdc-sink-57:8080

    debezium.format.value=json
    debezium.format.key=json
    debezium.format.value.schemas.enable=false

    debezium.source.connector.class=io.debezium.connector.mysql.MySqlConnector

    debezium.source.database.hostname=mysql-replica-57
    debezium.source.database.port=3306
    debezium.source.database.user=debezium
    debezium.source.database.password=dbz

    debezium.source.database.server.id=42
    debezium.source.topic.prefix=replica-cdc-57

    debezium.source.database.include.list=inventory
    debezium.source.table.include.list=inventory.customers

    debezium.source.offset.storage=io.debezium.storage.jdbc.offset.JdbcOffsetBackingStore
    debezium.source.offset.storage.jdbc.url=jdbc:mysql://mysql-debezium-state:3306/dbz_state_57?useSSL=false
    debezium.source.offset.storage.jdbc.user=dbz_state_57
    # password vía env var DEBEZIUM_SOURCE_OFFSET_STORAGE_JDBC_PASSWORD
    debezium.source.offset.storage.jdbc.offset.table.name=offset_storage
    debezium.source.offset.flush.interval.ms=10000

    debezium.source.schema.history.internal=io.debezium.storage.jdbc.history.JdbcSchemaHistory
    debezium.source.schema.history.internal.jdbc.url=jdbc:mysql://mysql-debezium-state:3306/dbz_state_57?useSSL=false
    debezium.source.schema.history.internal.jdbc.user=dbz_state_57
    # password vía env var DEBEZIUM_SOURCE_SCHEMA_HISTORY_INTERNAL_JDBC_PASSWORD
    debezium.source.schema.history.internal.jdbc.schema.history.table.name=schema_history

    debezium.source.snapshot.mode=initial

    quarkus.log.console.json=false
    quarkus.log.level=INFO
    quarkus.log.category."io.debezium".level=INFO
