apiVersion: v1
kind: Service
metadata:
  name: mysql-primary-57
  namespace: cdc-lab
  labels:
    app: mysql-primary
    stack: mysql57
spec:
  clusterIP: None
  selector:
    app: mysql-primary
    stack: mysql57
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-primary-nodeport-57
  namespace: cdc-lab
  labels:
    app: mysql-primary
    stack: mysql57
spec:
  type: NodePort
  selector:
    app: mysql-primary
    stack: mysql57
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
      nodePort: 30406
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql-primary-57
  namespace: cdc-lab
  labels:
    app: mysql-primary
    stack: mysql57
spec:
  serviceName: mysql-primary-57
  replicas: 1
  selector:
    matchLabels:
      app: mysql-primary
      stack: mysql57
  template:
    metadata:
      labels:
        app: mysql-primary
        stack: mysql57
    spec:
      containers:
        - name: mysql
          image: mysql:5.7
          imagePullPolicy: IfNotPresent
          args:
            - --default-authentication-plugin=mysql_native_password
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials-57
                  key: MYSQL_ROOT_PASSWORD
          ports:
            - name: mysql
              containerPort: 3306
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: config
              mountPath: /etc/mysql/conf.d
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: [mysqladmin, ping, -h, localhost, -uroot, -proot]
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 20
          livenessProbe:
            exec:
              command: [mysqladmin, ping, -h, localhost, -uroot, -proot]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
      volumes:
        - name: config
          configMap:
            name: mysql-primary-config-57
        - name: initdb
          configMap:
            name: mysql-primary-initdb-57
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
