apiVersion: batch/v1
kind: Job
metadata:
  generateName: load-mysql8-8-
  namespace: cdc-lab-file
  labels:
    app: load-generator
    target: mysql8
    stack: mysql8
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: load-generator
        target: mysql8
        stack: mysql8
    spec:
      restartPolicy: Never
      initContainers:
        - name: pip-install
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -e
              pip install --no-cache-dir --target /deps -r /script/requirements.txt
          volumeMounts:
            - name: script
              mountPath: /script
            - name: deps
              mountPath: /deps
      containers:
        - name: load-generator
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          env:
            - name: PYTHONPATH
              value: /deps
          command:
            - python
            - /script/random_changes.py
            - --target
            - mysql8
            - --host
            - mysql-primary-8
            - --port
            - "3306"
          volumeMounts:
            - name: script
              mountPath: /script
            - name: deps
              mountPath: /deps
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 200m
      volumes:
        - name: script
          configMap:
            name: load-generator-script
        - name: deps
          emptyDir: {}
