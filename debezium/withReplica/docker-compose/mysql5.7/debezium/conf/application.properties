# =============================================================================
# Debezium Server - configuración para CDC desde la RÉPLICA MySQL.
# =============================================================================
# Las escrituras se hacen contra mysql-primary (puerto host 3306). Debezium
# observa los cambios porque la réplica tiene log_slave_updates=ON y los
# re-loguea en su propio binlog.
# =============================================================================

# --- Sink: HTTP POST a un servicio sidecar que imprime los requests en su stdout ---
# (En Debezium 2.4.x el sink "log" todavía no existía, así que usamos "http"
#  apuntando al contenedor cdc-sink. Mira sus logs para ver los eventos:
#  docker compose logs -f cdc-sink)
debezium.sink.type=http
debezium.sink.http.url=http://cdc-sink:8080

# --- Formato de los eventos serializados ---
debezium.format.value=json
debezium.format.key=json
debezium.format.value.schemas.enable=false

# --- Conector de origen: MySQL ---
debezium.source.connector.class=io.debezium.connector.mysql.MySqlConnector

# Nos conectamos a la RÉPLICA, no al primario.
debezium.source.database.hostname=mysql-replica
debezium.source.database.port=3306
debezium.source.database.user=debezium
debezium.source.database.password=dbz

# server.id debe ser DISTINTO de los server-id del primary (1) y replica (2).
debezium.source.database.server.id=42

# Prefijo de "topic" lógico (también usado como nombre de servidor en metadatos).
debezium.source.topic.prefix=replica-cdc

# --- Filtros: qué bases y qué tablas capturar ---
# Debezium aplica primero database.include.list y luego table.include.list.
debezium.source.database.include.list=inventory

# Lista EXPLÍCITA de tablas de interés (formato db.tabla, separadas por coma).
# Para añadir más tablas: debezium.source.table.include.list=inventory.customers,inventory.orders
# Soporta regex: debezium.source.table.include.list=inventory\\.(customers|orders)
#
# ALTERNATIVA: blacklist en lugar de whitelist.
#   Comenta la línea de table.include.list y descomenta la siguiente para capturar
#   TODO inventory excepto audit_log:
#     debezium.source.table.exclude.list=inventory.audit_log
#   table.include.list y table.exclude.list son MUTUAMENTE EXCLUYENTES.
debezium.source.table.include.list=inventory.customers

# --- Almacenamiento local de offsets y schema history (modo standalone) ---
debezium.source.offset.storage=org.apache.kafka.connect.storage.FileOffsetBackingStore
debezium.source.offset.storage.file.filename=/debezium/data/offsets.dat
debezium.source.offset.flush.interval.ms=10000

debezium.source.schema.history.internal=io.debezium.storage.file.history.FileSchemaHistory
debezium.source.schema.history.internal.file.filename=/debezium/data/schema-history.dat

# --- Modo de snapshot inicial ---
# `initial`: hace snapshot de las tablas incluidas y luego pasa a streaming.
#            En MySQL 5.7 con FLUSH TABLES WITH READ LOCK puede congelar
#            momentáneamente el SQL thread de la réplica.
# Alternativa para evitar el lock: snapshot.mode=schema_only (no copia datos
#            iniciales, solo registra el esquema y arranca desde el binlog).
debezium.source.snapshot.mode=initial

# --- Logging de Quarkus (para que el sink "log" sea legible) ---
quarkus.log.console.json=false
quarkus.log.level=INFO
quarkus.log.category."io.debezium".level=INFO
