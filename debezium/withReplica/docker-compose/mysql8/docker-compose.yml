services:

  mysql-primary:
    image: mysql:8.0
    container_name: mysql8-primary
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3308:3306"
    volumes:
      - ./mysql/primary/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ./mysql/primary/init:/docker-entrypoint-initdb.d:ro
    networks:
      - cdc
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  mysql-replica:
    image: mysql:8.0
    container_name: mysql8-replica
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3309:3306"
    volumes:
      - ./mysql/replica/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ./mysql/replica/init:/docker-entrypoint-initdb.d:ro
      - ./mysql/replica/healthcheck.sh:/usr/local/bin/replica-healthcheck.sh:ro
    networks:
      - cdc
    depends_on:
      mysql-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/replica-healthcheck.sh"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 60s

  debezium-server:
    # Debezium 3.x se publica en quay.io, NO en Docker Hub.
    # Además, la imagen oficial 3.x solo trae preempaquetados los conectores
    # de Cassandra; el conector MySQL hay que descargarlo aparte. Por eso
    # construimos una imagen derivada que añade el conector MySQL.
    build:
      context: ./debezium
      args:
        DEBEZIUM_VERSION: 3.5.0.Final
    image: withreplica/debezium-server-mysql:3.5.0.Final
    container_name: mysql8-debezium-server
    volumes:
      # En Debezium 3.x el path de config es /debezium/config (en 2.x era /debezium/conf).
      - ./debezium/conf:/debezium/config:ro
      - debezium-data:/debezium/data
    networks:
      - cdc
    depends_on:
      mysql-replica:
        condition: service_healthy
      cdc-sink:
        condition: service_started

  cdc-sink:
    image: mendhak/http-https-echo:40
    container_name: mysql8-cdc-sink
    environment:
      HTTP_PORT: "8080"
      HTTPS_PORT: "8443"
    networks:
      - cdc

  # Cliente MySQL ad-hoc. Uso:
  #   docker compose run --rm mysql-client mysql -hmysql-primary -uroot -proot inventory
  #   docker compose run --rm mysql-client mysql -hmysql-replica -uroot -proot -e 'SHOW REPLICA STATUS\G'
  mysql-client:
    image: mysql:8.0
    profiles: ["tools"]
    networks:
      - cdc
    entrypoint: ["sh"]

volumes:
  debezium-data:

networks:
  cdc:
    driver: bridge
