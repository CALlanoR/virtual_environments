# =============================================================================
# Debezium Server 3.5.0.Final - configuración para CDC desde la RÉPLICA MySQL 8.0.
# =============================================================================
# Las escrituras se hacen contra mysql-primary (puerto host 3308). Debezium
# observa los cambios porque la réplica tiene log_replica_updates=ON y los
# re-loguea en su propio binlog.
# =============================================================================

# --- Sink: HTTP POST al sidecar cdc-sink ---
# Aunque Debezium 3.x ya incluye el sink "log", mantenemos paridad con el
# stack mysql5.7 (que NO tiene sink log) para que la observabilidad sea
# comparable 1:1 entre los dos stacks.
debezium.sink.type=http
debezium.sink.http.url=http://cdc-sink:8080

# --- Formato ---
debezium.format.value=json
debezium.format.key=json
debezium.format.value.schemas.enable=false

# --- Conector: MySQL ---
debezium.source.connector.class=io.debezium.connector.mysql.MySqlConnector

debezium.source.database.hostname=mysql-replica
debezium.source.database.port=3306
debezium.source.database.user=debezium
debezium.source.database.password=dbz

# server.id distinto de los del primary (1) y replica (2) y del stack 5.7 (42).
debezium.source.database.server.id=43

# Prefix distinto del stack 5.7 para no mezclar metadatos si en el futuro se
# rutearan a un mismo destino.
debezium.source.topic.prefix=replica-cdc-8

# --- Filtros: bases y tablas ---
debezium.source.database.include.list=inventory
# Whitelist de tablas (formato db.tabla, separadas por coma).
debezium.source.table.include.list=inventory.customers

# --- Almacenamiento de offsets y schema history (modo standalone) ---
debezium.source.offset.storage=org.apache.kafka.connect.storage.FileOffsetBackingStore
debezium.source.offset.storage.file.filename=/debezium/data/offsets.dat
debezium.source.offset.flush.interval.ms=10000

debezium.source.schema.history.internal=io.debezium.storage.file.history.FileSchemaHistory
debezium.source.schema.history.internal.file.filename=/debezium/data/schema-history.dat

# --- Snapshot ---
debezium.source.snapshot.mode=initial

# --- Logging ---
quarkus.log.console.json=false
quarkus.log.level=INFO
quarkus.log.category."io.debezium".level=INFO
